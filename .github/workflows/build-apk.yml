name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger button on GitHub

jobs:
  build:
    name: 🔨 Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Setup Android SDK
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Grant execute permission for Gradle
      - name: 🔧 Grant Gradle Permission
        run: chmod +x gradlew

      # 5. Build Debug APK
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. Build Release APK (unsigned)
      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # 7. Upload Debug APK
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizHackAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 8. Upload Release APK
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizHackAI-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 9. Summary
      - name: 📋 Build Summary
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Files:" >> $GITHUB_STEP_SUMMARY
          echo "- 🐛 **Debug APK** — Ready to install & test" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 **Release APK** — Optimized (unsigned)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Artifacts** section below ⬇️" >> $GITHUB_STEP_SUMMARY
